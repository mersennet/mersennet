global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'prime-chain-validators'
    static_configs:
      - targets:
          - 'validator-1:8545'
          - 'validator-2:8545'
          - 'validator-3:8545'
          - 'validator-4:8545'
    metrics_path: '/metrics'

  - job_name: 'prime-chain-rpc'
    static_configs:
      - targets: ['rpc-node:8545']
    metrics_path: '/metrics'
