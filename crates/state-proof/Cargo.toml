[package]
name = "mersennet-state-proof"
version = "0.7.0"
authors = ["MersennetNumbers Labs"]
edition = "2024"
license = "BUSL-1.1"
description = "revm-free state-transition proof envelopes and SP1 prover/verifier glue for Mersennet. Kept free of the EVM execution stack so the SP1 host can enable sp1-sdk/network without the revm c-kzg conflict."

[features]
default = []
# Real sp1_sdk CLI adapter backend. Mirrors mersennet's `sp1` feature.
sp1 = []

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hex = "0.4"
# Same alloy-primitives major that revm 12 re-exports as `revm::primitives`,
# so `B256`/`keccak256` unify across the mersennet re-export boundary.
alloy-primitives = { version = "0.7", features = ["serde"] }
mersennet-zkp = { path = "../zkp" }
