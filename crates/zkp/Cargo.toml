[package]
name = "prime-zkp"
version = "0.1.0"
authors = ["PrimeNumbers Labs"]
edition = "2024"
description = "Zero-knowledge primitives for Prime Chain: Poseidon hash, Pedersen commitment, threshold ElGamal, Noir circuit harness, and SP1 program interfaces."

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
sha3 = "0.10"
subtle = "2.5"

[dev-dependencies]
proptest = "1.4"

[features]
default = []
# Real Barretenberg/Noir prover bindings. When off, the verifier still
# works for hash-tree / Pedersen / threshold-encryption operations and
# uses a deterministic mock for Noir-circuit proof envelopes so the rest
# of the workspace can compile and test in CI without the proving stack.
prover = []
# Real sp1_sdk::ProverClient. When off, the SP1 verifier path uses the
# existing mock in crates/core/src/zk_sp1.rs.
sp1 = []
