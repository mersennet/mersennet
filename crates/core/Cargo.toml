[package]
name = "prime-chain"
version = "0.7.0"
authors = ["Rodolfo Cova @rodaemonic"]
edition = "2024"
autobenches = false

[features]
default = []
prover = ["prime-zkp/prover"]
sp1 = ["prime-zkp/sp1"]

[dependencies]
anyhow = "1.0"
hex = "0.4"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "sha256", "std"] }
sha3 = "0.10"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
sled = "0.34"
snow = "0.9"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
redb = "3"
tungstenite = "0.21"
url = "2.5"
serde_json = "1.0"
revm = { version = "12", default-features = false, features = ["std", "serde"] }
tiny_http = "0.12"
thiserror = "1.0"
rand = "0.8"
tempfile = "3.10"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
metrics = "0.19"
metrics-exporter-prometheus = "0.10"
once_cell = "1.20"

# ZK / privacy primitives. The shielded_state module and the new
# shielded order envelopes consume types from this crate.
prime-zkp = { path = "../zkp" }

[dev-dependencies]
tempfile = "3.10"
rand = "0.8"

[[bin]]
name = "tps-bench"
path = "benches/tps_bench.rs"

[[bin]]
name = "parallel-bench"
path = "benches/parallel_bench.rs"
