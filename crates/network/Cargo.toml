[package]
name = "mersennet-network"
version = "0.7.0"
authors = ["Rodolfo Cova @rodaemonic"]
edition = "2024"
license = "BUSL-1.1"

[dependencies]
mersennet = { path = "../core" }
anyhow = "1.0"
bincode = "1.3"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
revm = { version = "12", default-features = false, features = ["std", "serde", "c-kzg"] }
snow = "0.9"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
metrics = "0.19"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.10"
