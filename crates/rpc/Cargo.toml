[package]
name = "prime-chain-rpc"
version = "0.7.0"
authors = ["Rodolfo Cova @rodaemonic"]
edition = "2024"

[dependencies]
prime-chain = { path = "../core" }
anyhow = "1.0"
hex = "0.4"
metrics = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
revm = { version = "12", default-features = false, features = ["std", "serde"] }
tungstenite = "0.21"
tiny_http = "0.12"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.10"
serde_json = "1.0"
