[package]
name = "prime-chain-rpc"
version = "0.7.0"
authors = ["Rodolfo Cova @rodaemonic"]
edition = "2024"

[features]
default = []
prover = ["prime-chain/prover", "prime-zkp/prover"]
sp1 = ["prime-chain/sp1", "prime-zkp/sp1"]

[dependencies]
prime-chain = { path = "../core" }
prime-zkp = { path = "../zkp" }
anyhow = "1.0"
bincode = "1.3"
hex = "0.4"
metrics = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
revm = { version = "12", default-features = false, features = ["std", "serde"] }
tungstenite = "0.21"
tiny_http = "0.12"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.10"
serde_json = "1.0"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "sha256", "std"] }
