<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeNodes — Validator Dashboard</title>
    <meta name="description" content="Real-time validator monitoring and network health dashboard for Mersennet (Chain ID 7919)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'><rect width='96' height='96' rx='18' fill='black'/><g fill='%237dff9b'><rect x='8' y='14' width='12' height='68' rx='6'/><rect x='25' y='14' width='12' height='30' rx='6'/><rect x='42' y='14' width='12' height='46' rx='6'/><rect x='59' y='14' width='12' height='30' rx='6'/><rect x='76' y='14' width='12' height='68' rx='6'/></g></svg>">
</head>
<body>
    <div class="top-accent"></div>

    <header class="header">
        <div class="header-inner">
            <a href="#/dashboard" class="logo">
                <div class="logo-mark">
                    <svg width="32" height="22" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg"><g fill="#7dff9b"><rect x="8" y="14" width="12" height="68" rx="6"/><rect x="25" y="14" width="12" height="30" rx="6"/><rect x="42" y="14" width="12" height="46" rx="6"/><rect x="59" y="14" width="12" height="30" rx="6"/><rect x="76" y="14" width="12" height="68" rx="6"/></g></svg>
                </div>
                <div class="logo-text">
                    <span class="logo-name">PrimeNodes</span>
                    <span class="logo-sub">Validator Dashboard</span>
                </div>
            </a>

            <nav class="nav">
                <a href="#/dashboard" class="nav-link" data-page="dashboard">Dashboard</a>
                <a href="#/validators" class="nav-link" data-page="validators">Validators</a>
                <a href="#/network" class="nav-link" data-page="network">Network Stats</a>
            </nav>

            <button class="mobile-nav-btn" id="mobileNavBtn" aria-label="Toggle menu">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div class="header-right">
                <div class="header-stat">
                    <span class="header-stat-label">Status</span>
                    <span class="header-stat-value" id="hdrStatus">
                        <span class="pulse-dot"></span> Connecting
                    </span>
                </div>
                <div class="header-stat-sep"></div>
                <div class="header-stat">
                    <span class="header-stat-label">Block</span>
                    <span class="header-stat-value mono" id="hdrBlock">&mdash;</span>
                </div>
                <div class="header-stat-sep"></div>
                <div class="header-stat">
                    <span class="header-stat-label">Chain</span>
                    <span class="header-stat-value mono">7919</span>
                </div>
                <div class="header-stat-sep"></div>
                <button class="theme-toggle" id="themeToggle" title="Toggle theme">
                    <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 1V3M11 19V21M3 11H1M5.31 5.31L3.9 3.9M16.69 5.31L18.1 3.9M5.31 16.69L3.9 18.1M16.69 16.69L18.1 18.1M21 11H19M16 11a5 5 0 11-10 0 5 5 0 0110 0Z"/>
                    </svg>
                    <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div id="pageContent">
            <div class="page-loading">
                <div class="spinner"></div>
                <span>Connecting to Mersennet...</span>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-brand">
                &copy; 2026 Prime Numbers Labs
                <span class="footer-tag">Validator Dashboard &middot; Testnet</span>
            </div>
            <div class="footer-links">
                <a href="http://46.225.30.187/" target="_blank">Explorer</a>
                <span class="footer-sep">&middot;</span>
                <a href="http://46.225.30.187:4000" target="_blank">PrimeSwap V2</a>
                <span class="footer-sep">&middot;</span>
                <a href="http://46.225.30.187:4002" target="_blank">PrimeSwap V3</a>
                <span class="footer-sep">&middot;</span>
                <a href="http://46.225.30.187:4003" target="_blank">Faucet</a>
                <span class="footer-sep">&middot;</span>
                <a href="http://46.225.30.187:4004" target="_blank">PrimeTrade</a>
                <span class="footer-sep">&middot;</span>
                <a href="http://46.225.30.187:3001" target="_blank">Docs</a>
                <span class="footer-sep">&middot;</span>
                <a href="https://github.com/mersennet/mersennet" target="_blank">GitHub</a>
            </div>
            <div class="footer-meta">
                <span>Chain ID: <strong>7919</strong></span>
                <span class="footer-sep">&middot;</span>
                <span>Block: <strong id="footerBlock">&mdash;</strong></span>
            </div>
        </div>
    </footer>

    <div class="toast" id="toast" aria-live="polite"></div>
    <script src="app.js"></script>
    <script>
    (function() {
        var btn = document.getElementById('themeToggle');
        var sunIcon = btn.querySelector('.theme-icon-sun');
        var moonIcon = btn.querySelector('.theme-icon-moon');
        var isDark = localStorage.getItem('theme') === 'dark';

        function apply() {
            document.body.classList.toggle('dark-mode', isDark);
            sunIcon.style.display = isDark ? 'none' : 'block';
            moonIcon.style.display = isDark ? 'block' : 'none';
        }

        apply();

        btn.addEventListener('click', function() {
            isDark = !isDark;
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            apply();
        });
    })();
    </script>
</body>
</html>
