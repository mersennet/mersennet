name: CLA
# Contributor License Agreement check (CLA.md). On a contributor's first pull
# request the bot asks for the signature sentence; signatures are recorded in
# the `cla-signatures` branch of this repository. Re-runs on every PR update
# and on a "recheck" comment.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla-v1.json'
          path-to-document: 'https://github.com/mersennet/mersennet/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'dependabot[bot],github-actions[bot],Mersennet Bot,ArturoMersenne,xcantera,rodaemonic,RodolfoMersennet'
          custom-notsigned-prcomment: 'Thank you for the contribution. Before we can review it, please sign the [Contributor License Agreement](https://github.com/mersennet/mersennet/blob/main/CLA.md) by posting the sentence below as a comment on this pull request:'
          custom-pr-sign-comment: 'I have read the CLA document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you.'
          lock-pullrequest-aftermerge: false
