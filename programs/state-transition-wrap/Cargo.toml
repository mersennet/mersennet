[package]
name = "prime-chain-state-transition-wrap"
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"

[workspace]

[features]
default = []
real-sp1 = ["dep:sp1-sdk", "dep:sp1-verifier", "dep:ark-ff"]

[[bin]]
name = "prime-chain-state-transition-wrap"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(windows))'.dependencies]
ark-ff = { version = "0.5.0", optional = true }
sp1-sdk = { version = "6.2.2", optional = true, features = ["blocking"] }
sp1-verifier = { version = "6.2.2", optional = true, features = ["ark", "std"] }