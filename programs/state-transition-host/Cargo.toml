[package]
name = "prime-chain-state-transition-host"
version = "0.1.0"
edition = "2024"

[workspace]

[features]
default = []
real-sp1 = ["dep:sp1-sdk"]

[[bin]]
name = "prime-chain-state-transition-host"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
revm = { version = "12", default-features = false, features = ["std", "serde"] }
prime-chain = { path = "../../crates/core" }
prime-zkp = { path = "../../crates/zkp" }

[target.'cfg(not(windows))'.dependencies]
sp1-sdk = { version = "6.2.2", optional = true, features = ["blocking"] }